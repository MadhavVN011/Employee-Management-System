services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: company_ems
      DB_USER: ems
      DB_PASSWORD: ${DB_PASSWORD:-ems_local_password}
    volumes:
      - employee_images:/var/www/html/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: company_ems
      MARIADB_USER: ems
      MARIADB_PASSWORD: ${DB_PASSWORD:-ems_local_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ems_local_root}
    volumes:
      - database_data:/var/lib/mysql
      - ./database/company_ems.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  database_data:
  employee_images:
