<Directory /var/www/html>
    Options -Indexes
</Directory>

<Directory /var/www/html/database>
    Require all denied
</Directory>

<Directory /var/www/html/docker>
    Require all denied
</Directory>

<FilesMatch "^(Dockerfile|compose\.yaml|\.env.*)$">
    Require all denied
</FilesMatch>

<Directory /var/www/html/images>
    AllowOverride None
    Options -ExecCGI -Indexes
    <FilesMatch "\.(?i:php[0-9]*|phtml|pht|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
